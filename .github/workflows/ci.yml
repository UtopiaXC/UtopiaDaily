name: CI
run-name: CI ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontends
        run: |
          cd web/dashboard
          npm ci
          npm run build
          cd ../..

          cd web/newspaper
          npm ci
          npm run build
          cd ../..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and Build Backend
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/utopia_daily ./cmd/utopia_daily

